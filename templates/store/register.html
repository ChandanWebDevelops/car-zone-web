{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 p-4">
            <h2 class="fw-bold text-center mb-4">Create Account</h2>
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                <div class="mb-3">
                    <label class="form-label fw-bold">{{ field.label }}</label>
                    {{ field }}
                    {% if field.help_text %}
                        <small class="text-muted">{{ field.help_text }}</small>
                    {% endif %}
                </div>
                {% endfor %}
                <button type="submit" class="btn btn-dark w-100">Register</button>
            </form>
            <p class="text-center mt-3">Already have an account? <a href="{% url 'store:login' %}">Log In</a></p>
        </div>
    </div>
</div>
<style>
    input[type="text"], input[type="password"] {
        width: 100%; padding: 0.5rem; border: 1px solid #ced4da; border-radius: 0.375rem;
    }
</style>
{% endblock %}
