{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 p-4">
            <h2 class="fw-bold text-center mb-4">Log In</h2>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    {{ form.username }}
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    {{ form.password }}
                </div>
                <button type="submit" class="btn btn-dark w-100">Log In</button>
            </form>
            <p class="text-center mt-3">Don't have an account? <a href="{% url 'store:register' %}">Register</a></p>
        </div>
    </div>
</div>
<style>
    input[type="text"], input[type="password"] {
        width: 100%; padding: 0.5rem; border: 1px solid #ced4da; border-radius: 0.375rem;
    }
</style>
{% endblock %}
