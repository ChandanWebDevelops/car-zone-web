{% extends "base.html" %}

{% block content %}
<div class="text-center py-5">
    <i class="fas fa-check-circle fa-5x text-success mb-4"></i>
    <h1 class="fw-bold">Thank You!</h1>
    <p class="lead text-muted">Your order has been successfully placed.</p>
    <p>Your order number is <strong>#{{ order.id }}</strong>.</p>
    <p class="text-muted">We have sent a confirmation email to <strong>{{ order.email }}</strong>.</p>
    
    <a href="{% url 'store:car_list' %}" class="btn btn-dark btn-lg mt-3">
        Continue Shopping
    </a>
</div>
{% endblock %}
