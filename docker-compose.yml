version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=automarket
      - POSTGRES_USER=automarket
      - POSTGRES_PASSWORD=automarket
    # Healthcheck ensures Django waits for the DB to be fully ready
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automarket -d automarket"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Django Web Application
  web:
    build: .
    # Run migrations, collect static files, then start Gunicorn
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file: .env
    # Wait for the database to be healthy before starting
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: